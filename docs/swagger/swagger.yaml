            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Patch a user (safe)
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Assignment guarded by a content hash: 201 on create, 200 on replace,
