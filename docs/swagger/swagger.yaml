      parameters:
      - description: New user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserReq'
      - description: 'Required on /safe: one UUID per logical operation (max 255 chars)'
        in: header
        name: Idempotency-Key
        type: string
      - description: Tenant scope for the key on /safe (default \
        in: header
        name: X-Api-Key
        type: string
      - description: 'fail-after-write: return 500 after the insert'
        enum:
        - fail-after-write
        in: header
        name: X-Chaos
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created (or replayed on /safe)
          headers:
            Location:
              description: URI of the new user
              type: string
          schema:
            $ref: '#/definitions/model.User'
        "400":
