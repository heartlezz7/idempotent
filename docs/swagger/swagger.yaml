        name: body
        required: true
        schema:
          $ref: '#/definitions/model.PutUserReq'
      - description: Only replace if the current ETag matches
        in: header
        name: If-Match
        type: string
      - description: '* = only create, never replace'
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Replaced (or unchanged)
          headers:
            ETag:
              description: Current version
              type: string
          schema:
            $ref: '#/definitions/model.User'
        "201":
          description: Created
          headers:
            ETag:
              description: Current version
              type: string
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
