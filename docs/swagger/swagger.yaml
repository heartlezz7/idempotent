          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Create a user
      tags:
      - users
  /safe/users/{id}:
    delete:
      description: 'Guarded soft delete: 204 the first time, 410 after (tombstone),
        404 if it never existed.'
      parameters:
      - description: User ID (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted just now
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Delete a user (safe)
      tags:
      - users
    get:
      description: Returns an ETag; send it back as If-None-Match to get 304.
      parameters:
      - description: User ID (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: ETag from a previous GET, e.g. \
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
